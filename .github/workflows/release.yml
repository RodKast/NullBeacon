name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build teamserver (amd64)
        run: GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o nullbeacon-linux-amd64 ./cmd/teamserver
      - name: Build teamserver (arm64)
        run: GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o nullbeacon-linux-arm64 ./cmd/teamserver
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nullbeacon-linux-amd64
            nullbeacon-linux-arm64